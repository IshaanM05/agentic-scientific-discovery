# Claims audit input. Each claim ties a number printed in a document to a committed result file.
# Fields: id, doc, text (exact text in the doc), value (number as printed), source (file under runs/,
# results/, data/), key (JSON path, "/" separated, numeric = list index, "#len" = length) or pattern
# (regex, group 1 = number; count: true = number of matches), tol (absolute), optional op (lt/le/gt/ge),
# scale, branch (source committed only on that branch). Run: python scripts/check_claims.py
# Generated once from the documents; edit by hand afterwards. `unsourced` lists numbers with no committed source.
scan:
- README.md
- docs/RESULTS_LABLOOP.md
- docs/LABLOOP_README.md
- docs/DEMO_SCRIPT.md
notes:
- 'No sourced number differs from its committed source file: 0 mismatches among the claims below.'
- README.md says "40 offline tests pass"; pytest on integration/labloop collects 47 (41 passed, 5 skipped, 1 failed with the known omnigent import error in a sandbox). The count is not stored in any result file, so it is listed as unsourced, not checked.
- docs/LABLOOP_README.md prints pure BO hits by 60 as 8.2 while runs/benchmark_unseen.json and docs/RESULTS_LABLOOP.md give 8.25 (a rounding of 8.25, so the claim passes at tolerance 0.051); the 9.9 vs 8.25 headline gap is 1.65 in the data.
- The README LabLoop sections and docs/RESULTS_LABLOOP.md exist only on branch w2/labloop-results; on integration/labloop those claims report SKIP, not OK. Re-run the checker after merging w2 (any SKIP then means a document or source went missing; use --strict).
- Several README sentences restate numbers that appear earlier (for example the 22.2 s approval hold three times); each occurrence is its own claim, so an edit to one copy is caught.
