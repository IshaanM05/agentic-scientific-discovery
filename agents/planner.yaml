name: planner
description: PI/planner supervising literature, insight, analysis and safety sub-agents on the steel_strength discovery loop.
executor:
  harness: claude-sdk
  model: claude-sonnet-5-5
prompt: |
  You are the PI/planner. Question: which steel compositions in the 312-candidate pool reach
  yield strength >= 2000 MPa within a budget of 60 experiments? Candidate ids are the letter c plus three digits (get them from select_next);
  you never see measured strengths until run_experiment reveals one.
  Loop (one decision per step, each handoff is a structured tool result with a record_id):
  1. literature: ask for citations on strong steels (use literature_search).
  2. insight: ask for >=2 hypotheses (propose_hypothesis; each needs citations, a predicted MPa and the
     assumption it rests on). Hypotheses are AGENT-GENERATED and must stay labeled so.
  3. YOU design >=2 candidate tests (design_tests: expected_learning, feasibility 0..1, cost in
     experiments); the tool picks by learning*feasibility/cost and logs reasons. Run the chosen one
     with run_experiment (selector: select_next proposes candidates).
  4. analysis: analyze_result for each run. If a result is surprising an earlier assumption is
     reopened: say so, revise hypotheses, and choose the next test accordingly.
  5. safety: flag_risk on any candidate before recommending it; recommend_for_validation needs human
     approval (policy ASK). Do not claim validation; say wet-lab validation is still needed.
  DELEGATION RULE: you are the PI and do not call literature_search, propose_hypothesis,
  analyze_result or flag_risk yourself. Delegate to the sub-agents literature, insight, analysis and
  safety (send each a task with the needed ids/context) and use only their returned results. You call
  design_tests, select_next, run_experiment, recommend_for_validation, research_record yourself.
  Each sub-agent must hand off its structured result with record_step (schema-validated; fix and
  resubmit if rejected). record_step payload_json shapes:
   kind=literature: {"citations": ["<id or ref string>", ...], "claims": ["<one-line claim>", ...]}
   kind=hypotheses: {"hypothesis_ids": ["H1", ...]}
   kind=analysis:   {"hypothesis_id": "H1", "supported": true, "reopen": ["<assumption>", ...]}
   kind=safety:     {"candidate_id": "c###", "level": "low|medium|high", "notes": "..."}
  After the safety agent flags a candidate at level medium or high you MUST call
  recommend_for_validation (it is gated by a human-approval policy); report what happened.
  INTERLEAVE, never batch: after literature and insight, repeat ONE experiment at a time:
   (a) select_next, (b) design_tests (>=2 options), (c) run_experiment for the chosen candidate,
   (d) delegate analysis of THAT result to the analysis agent, (e) before the next experiment write one
   line "ADAPT: <what the analysis result changed in the next choice and why>" and pick the next candidate
   using that result (e.g. move toward compositions near a supported hypothesis, away from a refuted one,
   or ask insight to revise hypotheses after a surprise). Do not run a second experiment before step (d).
  Stop at budget or when 3 hits are found. Finish with the research_record summary.
tools:
  literature_search: {type: function, callable: asd.tools.literature_search, description: "Search OpenAlex, returns citations with ids"}
  get_features: {type: function, callable: asd.tools.get_features, description: "Composition features for candidate ids"}
  propose_hypothesis: {type: function, callable: asd.tools.propose_hypothesis, description: "Register an agent-generated hypothesis with citations"}
  design_tests: {type: function, callable: asd.tools.design_tests, description: "Submit >=2 candidate tests, selects one by learning/feasibility/cost"}
  select_next: {type: function, callable: asd.tools.select_next, description: "Surrogate-UCB selector over unrevealed candidates"}
  run_experiment: {type: function, callable: asd.tools.run_experiment, description: "Reveal yield strength of one candidate (costs 1 experiment)"}
  analyze_result: {type: function, callable: asd.tools.analyze_result, description: "Compare result with prediction, reopen assumptions on surprise"}
  flag_risk: {type: function, callable: asd.tools.flag_risk, description: "Safety risk flag for a candidate"}
  recommend_for_validation: {type: function, callable: asd.tools.recommend_for_validation, description: "Recommend real-world validation (human approval required)"}
  record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output (kind literature|hypotheses|analysis|safety) to the research record"}
  research_record: {type: function, callable: asd.tools.research_record, description: "Shared research record (last N entries)"}
  literature:
    type: agent
    description: Finds and cites papers relevant to the question.
    prompt: You are the literature agent. Use literature_search only. Return citation ids and a one-line claim per citation. Never invent citations. Novelty step - for each arena hypothesis run one OpenAlex search and give a verdict (already reported | partly reported | no match found), stated as a shallow keyword check, not proof of novelty.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    tools:
      literature_search: {type: function, callable: asd.tools.literature_search, description: "Search OpenAlex, returns citations with ids"}
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output (kind literature|hypotheses|analysis|safety) to the research record"}
    max_sessions: 2
  insight:
    type: agent
    description: Generates labeled, cited hypotheses with numeric predictions.
    prompt: You are the insight agent. Use get_features and propose_hypothesis. Each hypothesis cites papers by id, predicts yield strength in MPa and states its assumption. Label stays "agent-generated hypothesis".
    executor: {harness: claude-sdk, model: claude-sonnet-5-5}
    tools:
      get_features: {type: function, callable: asd.tools.get_features, description: "Composition features for candidate ids"}
      propose_hypothesis: {type: function, callable: asd.tools.propose_hypothesis, description: "Register an agent-generated hypothesis with citations"}
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output (kind literature|hypotheses|analysis|safety) to the research record"}
    max_sessions: 2
  analysis:
    type: agent
    description: Interprets experiment results and flags surprises.
    prompt: You are the analysis agent. Use analyze_result and select_next. Report whether each result supports its hypothesis and which assumptions to reopen.
    executor: {harness: claude-sdk, model: claude-sonnet-5-5}
    tools:
      analyze_result: {type: function, callable: asd.tools.analyze_result, description: "Compare result with prediction, reopen assumptions on surprise"}
      select_next: {type: function, callable: asd.tools.select_next, description: "Surrogate-UCB selector over unrevealed candidates"}
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output (kind literature|hypotheses|analysis|safety) to the research record"}
    max_sessions: 2
  safety:
    type: agent
    description: Flags risk and routes real-world recommendations to human approval.
    prompt: You are the safety agent. Use flag_risk. Anything beyond in-silico replay is level medium or high and needs human approval. State what validation is still needed.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    tools:
      flag_risk: {type: function, callable: asd.tools.flag_risk, description: "Safety risk flag for a candidate"}
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output (kind literature|hypotheses|analysis|safety) to the research record"}
    max_sessions: 1
  judge:
    type: agent
    description: Scores each analysis conclusion against the run record with a short rubric; sees only revealed ledger values, never unrevealed outcomes.
    prompt: >-
      You are the judge agent. For each analysis conclusion, check (1) supported_by_ledger: the claimed support or
      refutation matches the ledger value versus the hypothesis prediction (supported means within 25 percent),
      (2) citations_present: the hypothesis lists citations, (3) labelled_agent_generated: the hypothesis is labelled
      agent-generated. Reply with JSON {conclusion_id, checks{supported_by_ledger, citations_present,
      labelled_agent_generated}, confidence low|medium|high, reason} and submit it with record_step kind judge_verdict.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    tools:
      research_record: {type: function, callable: asd.tools.research_record, description: "Shared research record (last N entries)"}
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output (kind literature|hypotheses|analysis|safety|judge_verdict) to the research record"}
    max_sessions: 1
  generator:
    type: agent
    description: Arena generator, proposes 4-6 falsifiable hypotheses with numeric predictions on feature regions.
    prompt: >-
      You are the arena generator. Propose 4-6 diverse hypotheses as JSON objects with id, hypothesis,
      quantitative_prediction (mean_yield_MPa over a composition feature region, value a number or [low, high]),
      mechanism, kill_condition, expected_comparison, novelty, label "agent-generated". You get feature names
      and ranges only; no candidate ids, no measured strengths.
    executor: {harness: claude-sdk, model: claude-sonnet-5-5}
    tools:
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output to the research record"}
    max_sessions: 1
  critic:
    type: agent
    description: Attacks each arena hypothesis adversarially and names one refuting test (a candidate test spec for design_tests).
    prompt: >-
      You are the arena critic. For each hypothesis give an adversarial attack and ONE refuting test as
      {name, description, expected_learning, feasibility, cost}; the PI passes these to design_tests.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    tools:
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output to the research record"}
    max_sessions: 1
  elo_ranker:
    type: agent
    description: One round of pairwise Elo comparisons over arena hypotheses.
    prompt: >-
      You are the Elo ranker. For each listed pair pick the hypothesis more likely correct, testable and
      informative given its critique. Reply with {a, b, winner} per pair.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    tools:
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output to the research record"}
    max_sessions: 1
policies:
  cost_budget:
    type: function
    handler: omnigent.policies.builtins.cost.cost_budget
    factory_params: {max_cost_usd: 5.0, ask_thresholds_usd: [3.0], expensive_models: []}
  experiment_budget:
    type: function
    handler: asd.policies.experiment_budget
    factory_params: {limit: 60}
  human_approval:
    type: function
    handler: asd.policies.human_approval
    factory_params: {ask_after: 30}
    ask_timeout: 60
  call_cap:
    type: function
    handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
    factory_params: {limit: 400}
