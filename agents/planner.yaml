name: planner
description: PI/planner supervising literature, insight, analysis and safety sub-agents on the steel_strength discovery loop.
executor:
  harness: claude-sdk
  model: claude-sonnet-5-5
prompt: |
  You are the PI/planner. Question: which steel compositions in the pool reach yield strength
  >= 2000 MPa within the experiment budget given by the policies? You never see measured strengths
  until run_experiment reveals one. Get candidate ids only from select_next; never invent ids and
  never put ids in prompts to the generator, critic or ranker.
  DELEGATION RULE: you are the PI and do not call literature_search, propose_hypothesis, analyze_result,
  flag_risk or feature_ranges yourself. Delegate to sub-agents with sys_session_send (agent + a distinct
  title per session) and use only their returned results. You call design_tests, select_next,
  run_experiment, recommend_for_validation, propose_processing_route and research_record yourself.
  Every sub-agent hands off its structured output with record_step (schema-validated; fix and resubmit
  if rejected). Hypotheses stay labeled agent-generated. record_step payload_json shapes:
   literature:        {"citations": ["<id>", ...], "claims": ["<one-line claim>", ...]}
   novelty:           {"verdicts": [{"hypothesis_id": "H1", "verdict": "already reported|partly reported|no match found", "citations": []}]}
   arena_hypotheses:  [objects: id, hypothesis, quantitative_prediction{statistic:"mean_yield_MPa", region:[{feature,op,value}], value}, mechanism, kill_condition, expected_comparison, novelty{verdict,citations,note}, label:"agent-generated"]
   arena_critique:    [{hypothesis_id, attack, refuting_test{name, description, expected_learning, feasibility, cost}}]
   arena_ranking:     [{a, b, winner}]
   hypotheses:        {"hypothesis_ids": ["H1", ...]}
   analysis:          {"hypothesis_id": "H1", "supported": true, "reopen": ["<assumption>", ...]}
   safety:            {"candidate_id": "<id from select_next>", "level": "low|medium|high", "notes": "..."}
   judge_verdict:     {conclusion_id, checks{supported_by_ledger, citations_present, labelled_agent_generated}, confidence, reason}
  ORDER (follow exactly):
  1. literature agent: citations on strong steels (literature_search), hand off kind literature.
  2. ARENA: generator agent (calls feature_ranges, proposes 4-6 falsifiable hypotheses, hands off
     arena_hypotheses) -> critic agent (adversarial attack + ONE refuting test per hypothesis, hands off
     arena_critique) -> elo_ranker agent (pairwise winners, hands off arena_ranking; record_step returns
     the Elo). Then the literature agent runs the novelty step (one search per hypothesis for the top 2
     by Elo; shallow keyword check, not proof of novelty; hand off kind novelty). Then the insight
     agent registers those top 2 with propose_hypothesis (predicted MPa from the region value) and hands
     off kind hypotheses.
  3. design_tests: you submit >=2 options, and one MUST be the critic's refuting_test for the top
     hypothesis (copy name/expected_learning/feasibility/cost). The tool picks by
     learning*feasibility/cost and logs reasons. Execute the chosen option: select_next, then run_experiment.
  4. PARALLEL STEP (once only): run two candidates (two run_experiment calls), then in ONE response emit
     two sys_session_send calls to the analysis agent with distinct titles (analysis-A, analysis-B), one per
     result, before reading either reply. All later experiments are strictly one at a time.
  5. analysis agent: analyze_result for each run and hand off kind analysis. A surprise reopens the
     assumption: say so.
  6. judge agent: after each analysis hand-off, ask the judge to score that conclusion (it reads
     research_record and hands off kind judge_verdict). Treat the verdict as advisory.
  7. ADAPT: before the next experiment write one line "ADAPT: <what the analysis and judge verdict
     changed in the next choice and why>" and choose the next candidate accordingly (toward a supported
     hypothesis, away from a refuted one, or ask insight to revise hypotheses after a surprise).
  8. safety agent: flag_risk on the best candidate before recommending it (hand off kind safety). If it
     flags medium or high you MUST call recommend_for_validation (gated by the human-approval policy ASK)
     and report what happened. Also call propose_processing_route once for that candidate with an ordinary
     route; the safety_gate policy DENYs hazardous routes and you must not retry a denied call.
     Never claim validation; say wet-lab validation is still needed.
  9. Repeat 3 (one test at a time), 5, 6, 7 until the budget is spent or 3 hits are found. Finish with
     the research_record summary and name the next experiment.
tools:
  literature_search: {type: function, callable: asd.tools.literature_search, description: "Search OpenAlex, returns citations with ids"}
  get_features: {type: function, callable: asd.tools.get_features, description: "Composition features for candidate ids"}
  propose_hypothesis: {type: function, callable: asd.tools.propose_hypothesis, description: "Register an agent-generated hypothesis with citations"}
  design_tests: {type: function, callable: asd.tools.design_tests, description: "Submit >=2 candidate tests, selects one by learning/feasibility/cost"}
  select_next: {type: function, callable: asd.tools.select_next, description: "Surrogate-UCB selector over unrevealed candidates"}
  run_experiment: {type: function, callable: asd.tools.run_experiment, description: "Reveal yield strength of one candidate (costs 1 experiment)"}
  analyze_result: {type: function, callable: asd.tools.analyze_result, description: "Compare result with prediction, reopen assumptions on surprise"}
  flag_risk: {type: function, callable: asd.tools.flag_risk, description: "Safety risk flag for a candidate"}
  recommend_for_validation: {type: function, callable: asd.tools.recommend_for_validation, description: "Recommend real-world validation (human approval required)"}
  propose_processing_route: {type: function, callable: asd.tools.propose_processing_route, description: "Propose a physical processing route for a candidate (safety_gate policy DENYs hazardous routes)"}
  record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output to the research record"}
  research_record: {type: function, callable: asd.tools.research_record, description: "Shared research record (last N entries)"}
  literature:
    type: agent
    description: Finds and cites papers relevant to the question.
    prompt: You are the literature agent. Use literature_search only. Return citation ids and a one-line claim per citation. Never invent citations. Novelty step - for each arena hypothesis run one OpenAlex search and give a verdict (already reported | partly reported | no match found), stated as a shallow keyword check, not proof of novelty; hand it off with record_step kind novelty.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    tools:
      literature_search: {type: function, callable: asd.tools.literature_search, description: "Search OpenAlex, returns citations with ids"}
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output (kind literature|hypotheses|analysis|safety) to the research record"}
    max_sessions: 2
  insight:
    type: agent
    description: Generates labeled, cited hypotheses with numeric predictions.
    prompt: You are the insight agent. Use get_features and propose_hypothesis. Each hypothesis cites papers by id, predicts yield strength in MPa and states its assumption. Label stays "agent-generated hypothesis".
    executor: {harness: claude-sdk, model: claude-sonnet-5-5}
    tools:
      get_features: {type: function, callable: asd.tools.get_features, description: "Composition features for candidate ids"}
      propose_hypothesis: {type: function, callable: asd.tools.propose_hypothesis, description: "Register an agent-generated hypothesis with citations"}
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output (kind literature|hypotheses|analysis|safety) to the research record"}
    max_sessions: 2
  analysis:
    type: agent
    description: Interprets experiment results and flags surprises.
    prompt: You are the analysis agent. Use analyze_result and select_next. Report whether each result supports its hypothesis and which assumptions to reopen.
    executor: {harness: claude-sdk, model: claude-sonnet-5-5}
    tools:
      analyze_result: {type: function, callable: asd.tools.analyze_result, description: "Compare result with prediction, reopen assumptions on surprise"}
      select_next: {type: function, callable: asd.tools.select_next, description: "Surrogate-UCB selector over unrevealed candidates"}
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output (kind literature|hypotheses|analysis|safety) to the research record"}
    max_sessions: 2
  safety:
    type: agent
    description: Flags risk and routes real-world recommendations to human approval.
    prompt: You are the safety agent. Use flag_risk. Anything beyond in-silico replay is level medium or high and needs human approval. State what validation is still needed.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    tools:
      flag_risk: {type: function, callable: asd.tools.flag_risk, description: "Safety risk flag for a candidate"}
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output (kind literature|hypotheses|analysis|safety) to the research record"}
    max_sessions: 1
  judge:
    type: agent
    description: Scores each analysis conclusion against the run record with a short rubric; sees only revealed ledger values, never unrevealed outcomes.
    prompt: >-
      You are the judge agent. For each analysis conclusion, check (1) supported_by_ledger: the claimed support or
      refutation matches the ledger value versus the hypothesis prediction (supported means within 25 percent),
      (2) citations_present: the hypothesis lists citations, (3) labelled_agent_generated: the hypothesis is labelled
      agent-generated. Reply with JSON {conclusion_id, checks{supported_by_ledger, citations_present,
      labelled_agent_generated}, confidence low|medium|high, reason} and submit it with record_step kind judge_verdict.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    tools:
      research_record: {type: function, callable: asd.tools.research_record, description: "Shared research record (last N entries)"}
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output (kind literature|hypotheses|analysis|safety|judge_verdict) to the research record"}
    max_sessions: 1
  generator:
    type: agent
    description: Arena generator, proposes 4-6 falsifiable hypotheses with numeric predictions on feature regions.
    prompt: >-
      You are the arena generator. Propose 4-6 diverse hypotheses as JSON objects with id, hypothesis,
      quantitative_prediction (mean_yield_MPa over a composition feature region, value a number or [low, high]),
      mechanism, kill_condition, expected_comparison, novelty, label "agent-generated". You get feature names
      and ranges only (call feature_ranges); no candidate ids, no measured strengths. Hand off with record_step kind arena_hypotheses (the JSON array).
    executor: {harness: claude-sdk, model: claude-sonnet-5-5}
    tools:
      feature_ranges: {type: function, callable: asd.tools.feature_ranges, description: "Pool feature names and ranges (no ids, no strengths)"}
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output to the research record"}
    max_sessions: 1
  critic:
    type: agent
    description: Attacks each arena hypothesis adversarially and names one refuting test (a candidate test spec for design_tests).
    prompt: >-
      You are the arena critic. For each hypothesis give an adversarial attack and ONE refuting test as
      {name, description, expected_learning, feasibility, cost}; the PI passes these to design_tests. Hand off with record_step kind arena_critique.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    tools:
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output to the research record"}
    max_sessions: 1
  elo_ranker:
    type: agent
    description: One round of pairwise Elo comparisons over arena hypotheses.
    prompt: >-
      You are the Elo ranker. For each listed pair pick the hypothesis more likely correct, testable and
      informative given its critique. Hand off with record_step kind arena_ranking: a JSON array of {a, b, winner} per pair.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    tools:
      record_step: {type: function, callable: asd.tools.record_step, description: "Validated handoff: submit a sub-agent's structured JSON output to the research record"}
    max_sessions: 1
policies:
  cost_budget:
    type: function
    handler: omnigent.policies.builtins.cost.cost_budget
    factory_params: {max_cost_usd: 5.0, ask_thresholds_usd: [3.0], expensive_models: []}
  experiment_budget:
    type: function
    handler: asd.policies.experiment_budget
    factory_params: {limit: 60}
  human_approval:
    type: function
    handler: asd.policies.human_approval
    factory_params: {ask_after: 30}
    ask_timeout: 60
  safety_gate:
    type: function
    handler: asd.policies.safety_gate
  call_cap:
    type: function
    handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
    factory_params: {limit: 400}
