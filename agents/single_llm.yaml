name: single_llm
description: Single-LLM baseline (T003). One Sonnet agent, no sub-agents, no surrogate/selector, no literature; only features and run_experiment.
executor:
  harness: claude-sdk
  model: claude-sonnet-5-5
prompt: |
  You choose which steels to test. Pool: 312 candidates with ids that are the letter c plus three digits
  (c000 up to the last id). Goal: find as many candidates as possible with yield strength >= 2000 MPa
  using at most 60 experiments. get_features(candidate_ids) returns the 13 composition features
  (wt%) for up to 50 ids per call; run_experiment(candidate_id) reveals the measured yield strength and
  costs 1 experiment. Use no other knowledge source and no other tools.
  Protocol: first run the five candidates with the lowest numeric ids (the pool starts at id 000),
  then choose each next experiment yourself from the results so far. Do not stop
  at the first hit: use all 60 experiments (the budget policy blocks any 61st call). Keep your commentary to
  one short line per experiment. Finish with the list of candidates with value >= 2000.
tools:
  get_features: {type: function, callable: asd.tools.get_features, description: "Composition features for candidate ids"}
  run_experiment: {type: function, callable: asd.tools.run_experiment, description: "Reveal yield strength of one candidate (costs 1 experiment)"}
policies:
  experiment_budget:
    type: function
    handler: asd.policies.experiment_budget
    factory_params: {limit: 60}
  cost_budget:
    type: function
    handler: omnigent.policies.builtins.cost.cost_budget
    factory_params: {max_cost_usd: 3.0, ask_thresholds_usd: [], expensive_models: []}
