[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "princeton-plainsboro"
version = "0.1.0"
description = "House M.D.-style agentic lab for exoplanet candidate diagnosis (Hack-Nation x Databricks Omnigent, Challenge 03)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
demo = ["streamlit>=1.35"]
omnigent = ["omnigent>=0.16"]
real = ["lightkurve>=2.4"]
llm = ["openai>=1.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["plainsboro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
